name: CI

# Deliberately minimal: one end-to-end check that the project still builds and plays.
# Everything else (ruff, clippy, cargo test, the full pytest suite, ty, vitest, the sweeps)
# runs locally through pre-commit and the Makefile, so CI stays cheap to keep green.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Builds the Rust engine (ttr_rust) and installs the game server.
      - run: uv sync --group dev --extra web
      # The browser client builds.
      - run: npm ci && npm run build
        working-directory: web
      # Full games against the bots through the server's API on both maps, each replayed
      # from its seed to the same scores: engine, heuristics, server and store together.
      - run: uv run pytest tests/unit/web/test_play.py -k full_game
