name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  # ruff only, and the project is not installed (`--no-install-workspace`), so this is the
  # one job that needs no Rust toolchain -- it stays the fast feedback loop.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --group dev --no-install-workspace
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .

  # The engine. Every Rust test's fast tier: the port of the retired Python suite, the
  # naive in-crate references, the per-step differential against oracle-v1 (a git
  # dev-dependency fetched from this public repository, no credentials needed), and a
  # prefix of the golden corpus. Then the frozen fixtures, through their generators.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo run -q --release -p ttr-tools --bin gen-vectors -- --check
      - run: cargo run -q --release -p ttr-tools --bin gen-replays -- --check

  # ty must see torch to resolve imports under rl/, and ttr_rust (built by `uv sync`) to
  # resolve the engine -- so this needs a Rust toolchain as well as the torch install.
  # Linux torch comes from the pytorch-cpu index, so this is ~200MB, not ~3GB.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-extras --group dev
      - run: uv run ty check --output-format github

  # The Python suite, still with NO torch installed: that is what keeps it at a couple of
  # minutes and avoids the CUDA wheels entirely. `uv sync` builds ttr_rust.
  test-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run pytest -n auto
      - name: assert torch is absent
        run: uv run python -c "
          import importlib.util, sys;
          sys.exit(1) if importlib.util.find_spec('torch') else print('torch absent, as intended')"

  test-rl:
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'rl') || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # Resolves torch through the pytorch-cpu index (see [tool.uv.sources]); plain
      # torch on linux/cp314 would drag in 18 CUDA packages, ~3GB.
      - run: uv sync --extra rl --group dev
      - run: uv run pytest -n auto -m "torch"

  # The sweeps behind #[ignore]: the live crate against oracle-v1 over 10k seeds x every
  # (map, seat count) at every step, every heuristic against its frozen self, the whole
  # golden corpus on both builds, and the naive references at width. Then Python's slow
  # tier (arena statistics at scale).
  nightly:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: cargo test --workspace --release -- --ignored
      - run: uv sync --all-extras --group dev
      - run: uv run pytest -n auto -m "slow"
