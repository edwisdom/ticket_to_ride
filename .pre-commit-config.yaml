repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.17
    hooks:
      # Keeps uv.lock in sync with pyproject.toml -- the single biggest source of
      # "works on my machine".
      - id: uv-lock

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      # Not optional: the only thing standing between you and a 200MB checkpoint
      # living in git history forever.
      - id: check-added-large-files
        args: [--maxkb=1000]
