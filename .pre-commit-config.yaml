repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.17
    hooks:
      # Keeps uv.lock in sync with pyproject.toml -- the single biggest source of
      # "works on my machine".
      - id: uv-lock

  - repo: local
    hooks:
      # RULES.md and the map TOMLs are inputs to checked-in generated code in two
      # languages (the Rust engine's board tables, and the Python data module `ttr map`
      # and the UI read). Committing one without the other is how they would disagree.
      - id: gen-board
        name: board data is regenerated
        entry: uv run python tools/gen_board.py --check
        language: system
        pass_filenames: false
        files: ^(RULES\.md|ticket_to_ride/data/maps/.*\.toml|tools/gen_board\.py)$

      # The frozen fixtures: CONTRACT.md's vectors and the 84 golden replays, checked by
      # their Rust generators. A diff here is never "regenerate it" -- it means the engine
      # plays a different game. (The golden corpus is checked by `cargo test`.)
      - id: frozen-fixtures
        name: contract vectors and golden replays reproduce
        entry: bash -c 'cargo run -q --release -p ttr-tools --bin gen-vectors -- --check && cargo run -q --release -p ttr-tools --bin gen-replays -- --check'
        language: system
        pass_filenames: false
        files: ^(crates/ttr-core/src/.*\.rs|crates/ttr-tools/src/bin/gen-(vectors|replays)\.rs|tests/golden/.*)$

      # Rust formatting and lints. `cargo fmt` is fast enough to be unconditional; clippy
      # is scoped to Rust changes because a cold run is ~30s.
      - id: cargo-fmt
        name: rust is formatted
        entry: cargo fmt --all -- --check
        language: system
        pass_filenames: false
        files: ^(crates/.*\.rs|Cargo\.(toml|lock))$

      - id: cargo-clippy
        name: clippy is clean
        entry: cargo clippy --workspace --all-targets -- -D warnings
        language: system
        pass_filenames: false
        files: ^(crates/.*\.rs|crates/.*/Cargo\.toml|Cargo\.(toml|lock))$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      # Not optional: the only thing standing between you and a 200MB checkpoint
      # living in git history forever.
      - id: check-added-large-files
        args: [--maxkb=1000]
