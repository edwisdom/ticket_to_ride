repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.17
    hooks:
      # Keeps uv.lock in sync with pyproject.toml -- the single biggest source of
      # "works on my machine".
      - id: uv-lock

  - repo: local
    hooks:
      # RULES.md and the map TOMLs are inputs to checked-in generated code in two
      # languages. Committing one without the other is how the Python and Rust engines
      # would start disagreeing about the board itself.
      - id: gen-board
        name: board data is regenerated
        entry: uv run python tools/gen_board.py --check
        language: system
        pass_filenames: false
        files: ^(RULES\.md|ticket_to_ride/data/maps/.*\.toml|tools/gen_board\.py)$

      # docs/CONTRACT.md is the Phase 1 -> Phase 2 gate. Drift here is never a
      # regeneration: it invalidates every replay ever recorded.
      - id: contract-vectors
        name: frozen contract vectors reproduce
        entry: uv run python tools/gen_vectors.py --check
        language: system
        pass_filenames: false
        files: ^(ticket_to_ride/engine/.*\.py|tools/gen_vectors\.py|tests/golden/.*)$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      # Not optional: the only thing standing between you and a 200MB checkpoint
      # living in git history forever.
      - id: check-added-large-files
        args: [--maxkb=1000]
