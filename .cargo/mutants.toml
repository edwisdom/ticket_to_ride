# cargo-mutants (PLAN.md §14.1, Phase 3.1 step 5): does the suite catch real bugs, now
# that there is only one implementation? Rules, scoring, graph and the observation
# encoder are mutated; see docs/WORKLOG.md for the runs and how survivors were triaged.
#
#   cargo mutants -j 4                          # ttr-core's own tests
#   cargo mutants -j 4 --test-workspace=true    # + the oracle-v1 differential and corpus
examine_globs = [
    "crates/ttr-core/src/state.rs",
    "crates/ttr-core/src/scoring.rs",
    "crates/ttr-core/src/graph.rs",
    "crates/ttr-core/src/obs.rs",
]
test_package = ["ttr-core"]

# Equivalent mutants: each changes no observable result, only speed or a branch that cannot
# be reached. Pinned to file:line:col on purpose -- when the code moves, they stop matching
# and come back as "missed", to be triaged again rather than excluded by habit.
exclude_re = [
    # dsu_union returns early when ra == rb, so `>` and `>=` differ only where unreachable.
    'graph\.rs:58:11: replace > with >= in dsu_union',
    # A priced-out segment can never improve a distance (every distance starts at the
    # sentinel), and a city that cannot reach the target is never expanded either way: its
    # queue key lies beyond the ring, so it is drawn early and discarded as stale.
    'graph\.rs:230:41: replace \|\| with && in guided_distance',
    # The rest of a mask is `mask ^ low`; `mask | low` is the whole mask, which only adds
    # overlapping splits -- each an upper bound -- and cannot lower the minimum.
    'graph\.rs:396:25: replace \^ with \| in steiner_cost_with',
    # `low | s` and `low ^ s` agree: s never holds the lowest terminal.
    'graph\.rs:401:42: replace \| with \^ in steiner_cost_with',
    # `<` versus `<=` where the two sides are then equal: same value stored, same total.
    'graph\.rs:453:22: replace < with <= in mst_bound',
    # Never taking the Eulerian shortcut (the odd-city count gone negative, or `&&`): the
    # exhaustive search returns the same total.
    'graph\.rs:584:21: replace \+= with -= in Trail::component_longest',
    'graph\.rs:593:21: replace \|\| with && in Trail::component_longest',
    # `|` versus `^` on bits known to be disjoint: the vertex above bit 32 of the memo key,
    # and an edge bit already known to be clear in `used`.
    'graph\.rs:638:38: replace \| with \^ in Trail::best_from',
    'graph\.rs:648:71: replace \| with \^ in Trail::best_from',
    # OBS_VERSION is 1.
    'obs\.rs:56:5: replace obs_version -> u32 with 1',
    # Treating an unheld colour's reach as the wilds alone: every reach is `.max(wilds)`
    # afterwards anyway.
    'obs\.rs:751:22: replace > with >= in segment_dynamic',
]
