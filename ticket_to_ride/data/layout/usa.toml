[routes]
# [from, to, sagitta / chord]
bends = [
  ["Calgary", "Winnipeg", -0.06],
  ["Chicago", "Duluth", 0.12],
  ["Chicago", "Toronto", 0.06],
  ["Denver", "Omaha", 0.12],
  ["Denver", "Santa Fe", -0.06],
  ["Duluth", "Helena", 0.06],
  ["Duluth", "Winnipeg", 0.06],
  ["El Paso", "Los Angeles", 0.12],
  ["Helena", "Salt Lake City", -0.06],
  ["Helena", "Seattle", 0.18],
  ["Little Rock", "New Orleans", -0.12],
  ["Montreal", "New York", -0.06],
  ["New York", "Washington", 0.24],
  ["Pittsburgh", "Raleigh", -0.06],
  ["Pittsburgh", "Washington", -0.06],
  ["Portland", "Seattle", 0.06],
  ["Sault St. Marie", "Winnipeg", -0.06],
]

# Decorations, in board units: the compass rose's centre and radius, the route-points
# legend's top-left corner and scale, and lettering on the water [text, x, y, size, degrees].
[decor]
compass = [1442, 872, 50]
legend = [62, 846, 1.0]
water = [
  ["Atlantic Ocean", 1474, 640, 18, -80],
  ["Gulf of Mexico", 1040, 978, 20, 0],
]
