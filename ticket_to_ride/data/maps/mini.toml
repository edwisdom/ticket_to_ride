# TTR-mini -- a small board for brute-force verification and 10-minute training runs.
#
# Hand-authored (unlike usa.toml, which is generated from RULES.md). This is deliberately
# a *data file, not a code path*: same engine, same rules, smaller board. It pays for
# itself three ways -- exhaustive engine verification, fast algorithm iteration, and the
# only setting where an exploitability number is reachable.
#
# Design follows PLAN.md §13. The prior art's mini map dropped to 4 colors, max length 3
# and zero double routes, which removes color scarcity, the high-commitment end of the
# scoring curve, and blocking -- i.e. most of what makes TTR interesting. This one keeps
# 6 colors, max length 5, and 6 double routes.
#
#   14 cities · 24 city pairs · 30 segments · 101 spaces · 14 tickets · 54 cards
#
# Geography is the real western USA sub-map, so lat/lon can be shared with usa later.
# max_players is 4, not 5: 5 x 3 initial tickets would exceed the 14-ticket deck.
# Ticket points are the shortest-path cost in train cars between the two cities, which is
# asserted by tests/unit/engine/test_board.py.
schema = 1
name = "mini"
trains_per_player = 20
min_players = 2
max_players = 4
longest_path_bonus = 10
colors = ["black", "blue", "green", "orange", "red", "yellow"]
cards_per_color = 8
locomotives = 6
# route_points[i] scores a route of length i+1.
route_points = [1, 2, 4, 7, 10]
initial_ticket_deal = 3
initial_ticket_keep_min = 2
draw_ticket_deal = 3
draw_ticket_keep_min = 1

